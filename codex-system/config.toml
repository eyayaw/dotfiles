# Codex system config, linked at /etc/codex/config.toml. Codex writes its own
# state (trusted projects, plugins, the selected model) to ~/.codex/config.toml,
# and a key set there overrides the same key here.

# Claude Code-like: reads run freely in the read-only sandbox; any mutation
# (file writes, git ops, network writes) fails there, the model requests escalation,
# you get prompted, and approved commands run unsandboxed so they actually
# work. NOT "untrusted": that policy forbids escalation requests entirely
# ("you cannot ask for escalated permissions if the approval policy is
# UnlessTrusted"), so approved git ops still died on read-only .git.
# ~/.codex/rules/default.rules layers on top: allow = run outside the sandbox
# silently (gh/git reads, pytest); prompt = always ask (push, PR/issue mutations).
approval_policy = "on-request"
default_permissions = "github-read"
approvals_reviewer = "user"    # you do the approving, not auto-review

model_reasoning_effort = "high"

# Read-only files, plus read requests to the GitHub API through Codex's proxy.
# "limited" passes only GET, HEAD, and OPTIONS, so `gh api` reads work inside
# the sandbox, also in a pipeline, and every write still needs escalation.
# gh commands built on GraphQL (pr, issue, and repo view) send POST, so they
# run outside the sandbox through the allow rules.
[permissions.github-read]
extends = ":read-only"

[permissions.github-read.network]
enabled = true
mode = "limited"

[permissions.github-read.network.domains]
"api.github.com" = "allow"

[features]
network_proxy = true # without it the profile's domain and method rules are not enforced
memories = true
# snapshot wraps every command in `/bin/zsh -lc '...'`, which execpolicy can't
# parse -> trusted set and rules never match, everything prompts
shell_snapshot = false

[memories]
generate_memories = true
use_memories = true

[shell_environment_policy]
exclude = ["*KEY*", "*SECRET*"] # keep these variables out of the shells Codex runs

[tui]
notifications = true
